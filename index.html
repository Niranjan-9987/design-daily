<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design Daily — Daily Stories for Curious Minds</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #f5f5f3 0%, #fafaf8 100%);
            color: #2b2b2b;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .wrapper {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .streak {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
        }

        .streak-num {
            font-size: 16px;
            font-weight: 700;
            color: #d97757;
        }

        /* Daily Theme */
        .theme-card {
            background: white;
            border-radius: 2px;
            padding: 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 28px;
            border-left: 4px solid #d97757;
        }

        .theme-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .theme-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1a1a1a;
        }

        .theme-description {
            font-size: 15px;
            color: #666;
            line-height: 1.6;
        }

        /* Progress */
        .progress-section {
            margin-bottom: 24px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 13px;
            color: #999;
        }

        .progress-bar {
            height: 3px;
            background: #e8e8e6;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #d97757;
            transition: width 0.6s ease;
        }

        /* Question Card */
        .question-card {
            background: white;
            border-radius: 2px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 24px;
        }

        .question-number {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .question-text {
            font-size: 22px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 24px;
            color: #1a1a1a;
        }

        .question-text strong {
            font-weight: 700;
        }

        .hint {
            background: #f9f7f5;
            border-left: 3px solid #d97757;
            padding: 12px 16px;
            border-radius: 2px;
            margin-bottom: 24px;
            font-size: 14px;
            color: #777;
            font-style: italic;
        }

        .hint-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            margin-bottom: 4px;
            font-style: normal;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option {
            border: 1px solid #ddd;
            padding: 16px 20px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: white;
            text-align: left;
            font-size: 15px;
            position: relative;
        }

        .option:hover:not(.disabled) {
            border-color: #999;
            background: #fefdfb;
            transform: translateX(4px);
        }

        .option.selected {
            border-color: #2b2b2b;
            background: #f5f5f3;
        }

        .option.correct {
            border-color: #5a9e6f;
            background: #f0f7f3;
            color: #2d5a3d;
        }

        .option.incorrect {
            border-color: #b8665d;
            background: #faf3f1;
            color: #5d3d35;
        }

        .option.disabled {
            cursor: default;
        }

        /* Feedback */
        .feedback-container {
            margin-top: 24px;
            display: none;
        }

        .feedback-container.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feedback {
            padding: 16px;
            border-radius: 2px;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .feedback.correct {
            background: #f0f7f3;
            color: #2d5a3d;
            border-left: 3px solid #5a9e6f;
        }

        .feedback.incorrect {
            background: #faf3f1;
            color: #5d3d35;
            border-left: 3px solid #b8665d;
        }

        .feedback strong {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
        }

        .feedback-insight {
            background: white;
            border: 1px solid #e0e0dd;
            padding: 16px;
            border-radius: 2px;
            margin-top: 16px;
            font-size: 14px;
            color: #555;
        }

        .insight-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .insight-text {
            font-style: italic;
            color: #666;
        }

        .community-stat {
            background: #fafaf8;
            padding: 12px 16px;
            border-radius: 2px;
            font-size: 14px;
            text-align: center;
            color: #777;
            margin-top: 16px;
        }

        .stat-value {
            font-weight: 700;
            color: #2b2b2b;
            display: block;
            font-size: 18px;
        }

        /* Navigation */
        .nav-buttons {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: 1px solid #ddd;
            background: white;
            color: #2b2b2b;
            border-radius: 2px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn:hover {
            border-color: #2b2b2b;
            background: #f5f5f3;
        }

        .btn.primary {
            background: #2b2b2b;
            color: white;
            border-color: #2b2b2b;
        }

        .btn.primary:hover {
            background: #1a1a1a;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Completion */
        .completion-card {
            background: white;
            border-radius: 2px;
            padding: 48px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            text-align: center;
        }

        .completion-emoji {
            font-size: 56px;
            margin-bottom: 16px;
        }

        .completion-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .completion-text {
            color: #666;
            margin-bottom: 32px;
            font-size: 15px;
        }

        .completion-stat {
            background: #f5f5f3;
            padding: 20px;
            border-radius: 2px;
            margin-bottom: 32px;
        }

        .stat-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-display {
            font-size: 32px;
            font-weight: 700;
            color: #d97757;
        }

        @media (max-width: 600px) {
            .question-card {
                padding: 28px 20px;
            }

            .question-text {
                font-size: 18px;
            }

            .theme-title {
                font-size: 22px;
            }

            .nav-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Header -->
        <div class="header">
            <div class="logo">Design Daily</div>
            <div class="streak">
                🔥 <span class="streak-num" id="streakNum">0</span>
            </div>
        </div>

        <!-- Daily Story Container -->
        <div id="storyContainer"></div>
    </div>

    <script>
        // Daily stories with related questions building a narrative
        const stories = [
            {
                id: 0,
                day: "How Nature Solves Problems",
                description: "Exploring emergent behavior, efficiency, and adaptation across different scales.",
                questions: [
                    {
                        number: 1,
                        text: "How do <strong>murmuration patterns</strong> in starling flocks form without a leader directing them?",
                        hint: "Each bird follows simple rules about its immediate neighbors.",
                        options: [
                            { text: "One alpha bird leads the entire flock", correct: false },
                            { text: "Each bird follows simple local rules based on neighbors", correct: true },
                            { text: "Birds communicate through ultrasonic calls", correct: false },
                            { text: "The pattern is random and accidental", correct: false }
                        ],
                        feedback: "Murmurations emerge from local behavior, not top-down control. Each bird adjusts position relative to its neighbors—no headquarters needed.",
                        insight: "This principle applies everywhere: markets, immune systems, ant colonies. Complex order without central planning."
                    },
                    {
                        number: 2,
                        text: "Why does <strong>mud crack</strong> in regular hexagonal patterns, not random shapes?",
                        hint: "Hexagons minimize the perimeter needed to divide an area.",
                        options: [
                            { text: "Hexagons are the strongest shape in nature", correct: false },
                            { text: "Water evaporates uniformly in six directions", correct: false },
                            { text: "The pattern minimizes stress and energy efficiently", correct: true },
                            { text: "Mud naturally prefers hexagonal shapes", correct: false }
                        ],
                        feedback: "Geometry solves the problem. Hexagons distribute stress while using minimal material—nature's answer to 'do more with less.'",
                        insight: "Honeycomb, basalt columns, dragonfly eyes: nature keeps arriving at hexagons. A design principle older than design itself."
                    },
                    {
                        number: 3,
                        text: "<strong>Mycelium networks</strong> underground can span miles and connect trees, allowing them to share nutrients and information.",
                        hint: "The forest functions as a single interconnected system.",
                        options: [
                            { text: "True", correct: true },
                            { text: "False", correct: false }
                        ],
                        feedback: "True. The 'wood wide web' shows forests aren't collections of individual trees—they're a connected system where the whole is stronger.",
                        insight: "A felled tree can still nourish neighbors through the network. This challenges our notion of individual success."
                    },
                    {
                        number: 4,
                        text: "Which natural system demonstrates <strong>both emergence and efficiency</strong>?",
                        hint: "Think about all three examples we've explored.",
                        options: [
                            { text: "Only murmurations", correct: false },
                            { text: "Only hexagonal patterns", correct: false },
                            { text: "Only mycelium networks", correct: false },
                            { text: "All three—they share the same principle", correct: true }
                        ],
                        feedback: "All three systems show: simple local rules → complex global behavior. And all solve the problem of maximum efficiency.",
                        insight: "The principle: Constraint breeds elegance. Local optimization creates global solutions."
                    },
                    {
                        number: 5,
                        text: "As a designer, which insight resonates most with your work?",
                        hint: "Think about how you approach problems.",
                        options: [
                            { text: "Emergent systems (let order emerge from rules)", correct: false },
                            { text: "Geometric efficiency (do more with less)", correct: false },
                            { text: "Interconnection (everything is connected)", correct: false },
                            { text: "All three inform how I design", correct: true }
                        ],
                        feedback: "The most powerful designers think in systems: simple rules, geometric restraint, and understanding how pieces connect.",
                        insight: "Nature has been solving design problems for 4 billion years. We're just learning the alphabet."
                    }
                ]
            },
            {
                id: 1,
                day: "Feedback Loops That Build",
                description: "How systems amplify, how metrics shape behavior, how small changes create big effects.",
                questions: [
                    {
                        number: 1,
                        text: "In nature, <strong>predator-prey cycles</strong> show that populations increase together in a pattern called the Lotka-Volterra model.",
                        hint: "More food → more predators → less food → pattern repeats.",
                        options: [
                            { text: "True", correct: true },
                            { text: "False", correct: false }
                        ],
                        feedback: "True. This elegant feedback loop generates oscillation—a dance between two populations. Neither controls the other; the pattern emerges.",
                        insight: "Feedback loops aren't chaos—they're self-correcting systems. The economy, climate, even your body uses them."
                    },
                    {
                        number: 2,
                        text: "What is <strong>Goodhart's Law</strong>?",
                        hint: "It's about what happens when you optimize for a metric.",
                        options: [
                            { text: "When a measure becomes a target, it ceases to be a good measure", correct: true },
                            { text: "Good design is invisible", correct: false },
                            { text: "Markets always reach equilibrium", correct: false },
                            { text: "People are rational economic actors", correct: false }
                        ],
                        feedback: "Once you optimize for a metric, people game it. Test scores rise but learning drops. Engagement metrics climb but loyalty falls.",
                        insight: "What you measure shapes what people do. Choose your metrics carefully—they become your culture."
                    },
                    {
                        number: 3,
                        text: "A company removed all office clocks and structured breaks. Employees worked longer but reported higher satisfaction.",
                        hint: "Perception shapes behavior as much as reality.",
                        options: [
                            { text: "Employees are being exploited more", correct: false },
                            { text: "This reveals how environmental design shapes behavior", correct: true },
                            { text: "The effect won't last long-term", correct: false }
                        ],
                        feedback: "Without time cues, people stopped watching the clock. They worked to task completion instead of time passage. The environment changed behavior.",
                        insight: "Environment is design's most powerful lever. Remove the constraint, change the outcome."
                    },
                    {
                        number: 4,
                        text: "Which best describes a <strong>virtuous cycle</strong>?",
                        hint: "One where each step reinforces the next, building momentum.",
                        options: [
                            { text: "Success → more confidence → more risk-taking → more success", correct: true },
                            { text: "Failure → fear → avoidance → stagnation", correct: false },
                            { text: "Stability → no change → no growth", correct: false },
                            { text: "All feedback loops are virtuous", correct: false }
                        ],
                        feedback: "Virtuous cycles accelerate. Each win builds momentum. The opposite—vicious cycles—spiral downward. Design systems, not individual actions.",
                        insight: "Small interventions in the right place cascade. This is leverage. This is where design thinking wins."
                    },
                    {
                        number: 5,
                        text: "What feedback loops are you creating in your designs?",
                        hint: "Consider both intentional and unintended consequences.",
                        options: [
                            { text: "I focus on single interactions, not systems", correct: false },
                            { text: "I map how each action creates reactions", correct: true },
                            { text: "Feedback loops are too complex to predict", correct: false },
                            { text: "That's for product managers, not designers", correct: false }
                        ],
                        feedback: "Great designers think in feedback loops. They ask: What happens when people use this? What cascades from that?",
                        insight: "The best design decisions multiply. You're not just designing interfaces—you're designing incentive systems."
                    }
                ]
            }
        ];

        let currentStoryId = 0;
        let currentQuestionIndex = 0;
        let answeredQuestions = [];

        function getTodaysStory() {
            const today = new Date();
            const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
            return stories[dayOfYear % stories.length];
        }

        function renderStory() {
            const story = getTodaysStory();
            currentStoryId = story.id;
            currentQuestionIndex = 0;
            answeredQuestions = [];

            const html = `
                <div class="theme-card">
                    <div class="theme-label">Today's Story</div>
                    <div class="theme-title">${story.day}</div>
                    <div class="theme-description">${story.description}</div>
                </div>
                <div id="questionContainer"></div>
            `;

            document.getElementById('storyContainer').innerHTML = html;
            renderQuestion(story);
        }

        function renderQuestion(story) {
            const question = story.questions[currentQuestionIndex];
            const container = document.getElementById('questionContainer');

            const progressPercentage = ((currentQuestionIndex + 1) / story.questions.length) * 100;

            let html = `
                <div class="progress-section">
                    <div class="progress-info">
                        <span>Question ${currentQuestionIndex + 1} of ${story.questions.length}</span>
                        <span id="completionPercent">${Math.round(progressPercentage)}%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${progressPercentage}%;"></div>
                    </div>
                </div>

                <div class="question-card">
                    <div class="question-number">Question ${question.number}</div>
                    <div class="question-text">${question.text}</div>
                    <div class="hint">
                        <div class="hint-label">Hint</div>
                        ${question.hint}
                    </div>
                    <div class="options" id="optionsContainer">
            `;

            question.options.forEach((option, index) => {
                html += `
                    <div class="option" onclick="selectAnswer(${currentQuestionIndex}, ${index}, ${option.correct})">
                        ${option.text}
                    </div>
                `;
            });

            html += `
                    </div>
                    <div class="feedback-container" id="feedbackContainer"></div>
                </div>
            `;

            container.innerHTML = html;
        }

        function selectAnswer(questionIdx, optionIdx, isCorrect) {
            const story = getTodaysStory();
            const question = story.questions[questionIdx];
            const options = document.querySelectorAll('.option');

            // Mark answer
            options.forEach((opt, i) => {
                opt.classList.add('disabled');
                if (i === optionIdx) {
                    opt.classList.add('selected');
                    if (isCorrect) {
                        opt.classList.add('correct');
                    } else {
                        opt.classList.add('incorrect');
                    }
                } else if (question.options[i].correct) {
                    opt.classList.add('correct');
                }
            });

            // Show feedback
            const feedbackContainer = document.getElementById('feedbackContainer');
            feedbackContainer.classList.add('show');

            const feedbackHtml = `
                <div class="feedback ${isCorrect ? 'correct' : 'incorrect'}">
                    <strong>${isCorrect ? '✓ Correct' : '✗ Consider this'}</strong>
                    ${question.feedback}
                </div>
                <div class="feedback-insight">
                    <div class="insight-label">Insight</div>
                    <div class="insight-text">${question.insight}</div>
                </div>
                <div class="community-stat">
                    <div class="stat-value">${Math.floor(Math.random() * 40) + 60}%</div>
                    of designers answered like you
                </div>
            `;

            feedbackContainer.innerHTML = feedbackHtml;

            // Record answer
            answeredQuestions.push({ question: questionIdx, answer: optionIdx, correct: isCorrect });

            // Show next button or completion
            setTimeout(() => {
                if (currentQuestionIndex < story.questions.length - 1) {
                    feedbackContainer.innerHTML += `
                        <div class="nav-buttons">
                            <button class="btn primary" onclick="nextQuestion()">Next Question →</button>
                        </div>
                    `;
                } else {
                    feedbackContainer.innerHTML += `
                        <div class="nav-buttons">
                            <button class="btn primary" onclick="showCompletion()">See Your Story</button>
                        </div>
                    `;
                }
            }, 100);

            updateStreak();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            const story = getTodaysStory();
            renderQuestion(story);
        }

        function showCompletion() {
            const story = getTodaysStory();
            const correctCount = answeredQuestions.filter(a => a.correct).length;
            const percentage = Math.round((correctCount / answeredQuestions.length) * 100);

            const html = `
                <div class="completion-card">
                    <div class="completion-emoji">✨</div>
                    <div class="completion-title">You've completed today's story</div>
                    <div class="completion-text">"${story.day}"</div>
                    <div class="completion-stat">
                        <div class="stat-label">Your Understanding</div>
                        <div class="stat-display">${percentage}%</div>
                    </div>
                    <div style="color: #666; font-size: 14px; margin-bottom: 32px;">
                        <p style="margin-bottom: 8px;">You answered ${correctCount} of ${answeredQuestions.length} questions correctly.</p>
                        <p style="margin-bottom: 8px;">Come back tomorrow for a new story.</p>
                    </div>
                    <button class="btn primary" onclick="location.reload()">Done</button>
                </div>
            `;

            document.getElementById('storyContainer').innerHTML = html;
        }

        function updateStreak() {
            const streak = parseInt(localStorage.getItem('streak') || '0') + 1;
            localStorage.setItem('streak', streak);
            document.getElementById('streakNum').textContent = streak;
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderStory();
            const streak = localStorage.getItem('streak') || '0';
            document.getElementById('streakNum').textContent = streak;
        });
    </script>
</body>
</html>
